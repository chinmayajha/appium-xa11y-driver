name: Bug
description: The driver does not do what the docs say.
labels: [bug]
body:
  - type: input
    id: os
    attributes:
      label: OS and version of the Host
      placeholder: Debian 13, macOS 15.5, Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: Session type
      options:
        - X11
        - Wayland
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: toolkit
    attributes:
      label: Toolkit of the app and its version
      placeholder: GTK 4.18, Qt 6.8, AppKit
    validations:
      required: true
  - type: input
    id: appium
    attributes:
      label: Appium version
    validations:
      required: true
  - type: input
    id: driver
    attributes:
      label: Driver version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected result and actual result
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Appium log
      render: text
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Page source of the screen
      render: xml
    validations:
      required: true
