# Untested: written and checked with actionlint, but not run on GitHub yet.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: shellcheck hosts/linux/setup.sh hosts/mac/setup.sh
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  linux:
    needs: static
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - run: hosts/linux/setup.sh --driver . --fixtures --no-service
      - run: echo "$HOME/.local/share/appium-xa11y/node/bin" >> "$GITHUB_PATH"
      - name: Start Appium
        run: |
          ~/.local/share/appium-xa11y/host.sh run > appium.log 2>&1 &
          for _ in $(seq 60); do curl -sf http://127.0.0.1:4723/status > /dev/null && exit 0; sleep 1; done
          echo "Appium did not start" >&2
          exit 1
      - run: npm run conformance -- --url http://127.0.0.1:4723 --os linux
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appium-log-linux
          path: appium.log
          if-no-files-found: ignore

  docker:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - run: docker build -f docker/linux/Dockerfile -t appium-xa11y-linux .
      - name: Start the container
        run: |
          docker run -d --name appium -p 127.0.0.1:4723:4723 appium-xa11y-linux
          for _ in $(seq 60); do curl -sf http://127.0.0.1:4723/status > /dev/null && exit 0; sleep 1; done
          docker logs appium >&2
          exit 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run conformance -- --url http://127.0.0.1:4723 --os linux

  macos:
    needs: static
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Find the node binary
        id: node
        run: echo "path=$(node -p 'require("fs").realpathSync(process.execPath)')" >> "$GITHUB_OUTPUT"
      - uses: xa11y/setup-a11y@0dad2b7bb4c0d4601e99e53d9b42b3195274aa3d
        with:
          macos-tcc-client: ${{ steps.node.outputs.path }}
      # setup-a11y grants only Accessibility. Screenshots also need Screen Recording.
      - name: Grant Screen Recording to node
        env:
          CLIENT: ${{ steps.node.outputs.path }}
        run: |
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access(service,client,client_type,auth_value,auth_reason,auth_version,csreq,policy_id,indirect_object_identifier_type,indirect_object_identifier,indirect_object_code_identity,flags,last_modified) \
             VALUES('kTCCServiceScreenCapture','${CLIENT}',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$(date +%s));"
          sudo launchctl stop com.apple.tccd || true
          sleep 2
      - run: hosts/mac/setup.sh --driver . --no-service
      - name: Start Appium
        run: |
          "$HOME/Library/Application Support/appium-xa11y/host.sh" run > appium.log 2>&1 &
          for _ in $(seq 60); do curl -sf http://127.0.0.1:4723/status > /dev/null && exit 0; sleep 1; done
          echo "Appium did not start" >&2
          exit 1
      - run: screencapture -x debug-mac1-before.png || true
      - run: npm run conformance -- --url http://127.0.0.1:4723 --os mac
      - if: always()
        run: screencapture -x debug-mac1-after.png || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appium-log-macos
          path: |
            appium.log
            debug-mac1-*.png
          if-no-files-found: ignore

  windows:
    needs: static
    runs-on: windows-latest
    timeout-minutes: 20
    # The Windows adapter is not proven yet: the job shows which calls still fail.
    continue-on-error: true
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the driver
        shell: bash
        env:
          APPIUM_HOME: ${{ runner.temp }}/appium-home
        run: npx appium driver install --source=local "$GITHUB_WORKSPACE"
      - name: Start Appium
        shell: bash
        env:
          APPIUM_HOME: ${{ runner.temp }}/appium-home
        run: |
          npx appium --address 127.0.0.1 --port 4723 > appium.log 2>&1 &
          for _ in $(seq 60); do curl -sf http://127.0.0.1:4723/status > /dev/null && exit 0; sleep 1; done
          echo "Appium did not start" >&2
          exit 1
      - run: npm run conformance -- --url http://127.0.0.1:4723 --os windows
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appium-log-windows
          path: appium.log
          if-no-files-found: ignore
