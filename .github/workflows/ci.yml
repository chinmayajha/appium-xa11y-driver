name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      xa11y_ref:
        description: Run with xa11y built from owner/repo@ref in place of the pinned release
        required: false

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: shellcheck hosts/linux/setup.sh hosts/mac/setup.sh scripts/xa11y-from-ref.sh
      - name: Parse the Windows setup script
        shell: pwsh
        run: |
          $e = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/hosts/windows/setup.ps1", [ref]$null, [ref]$e)
          if ($e.Count) { $e | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  linux:
    needs: static
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: ${{ inputs.xa11y_ref && 40 || 20 }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - run: hosts/linux/setup.sh --driver . --fixtures --no-service
      - run: echo "$HOME/.local/share/appium-xa11y/node/bin" >> "$GITHUB_PATH"
      - name: Use xa11y from xa11y_ref
        if: inputs.xa11y_ref
        env:
          XA11Y_REF: ${{ inputs.xa11y_ref }}
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git build-essential pkg-config libxkbcommon-dev libevdev-dev
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"
          scripts/xa11y-from-ref.sh "$XA11Y_REF"
      - name: Start Appium
        run: |
          ~/.local/share/appium-xa11y/host.sh run > appium.log 2>&1 &
          for _ in $(seq 60); do curl -sf http://127.0.0.1:4723/status > /dev/null && exit 0; sleep 1; done
          echo "Appium did not start" >&2
          exit 1
      - run: npm run conformance -- --url http://127.0.0.1:4723 --os linux
      - name: host.sh stops when a different Appium holds its port
        shell: bash
        run: |
          rc=0
          out=$(timeout 60 ~/.local/share/appium-xa11y/host.sh run 2>&1) || rc=$?
          echo "$out"
          [ "$rc" != 0 ] && grep 'port 4723 is in use by pid [0-9]* (.*appium' <<<"$out" > /dev/null
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appium-log-linux
          path: appium.log
          if-no-files-found: ignore

  docker:
    needs: static
    # The image installs the pinned xa11y from npm.
    if: ${{ !inputs.xa11y_ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - run: docker build -f docker/linux/Dockerfile -t appium-xa11y-linux .
      - name: Start the container
        run: |
          docker run -d --name appium -p 127.0.0.1:4723:4723 appium-xa11y-linux
          for _ in $(seq 60); do curl -sf http://127.0.0.1:4723/status > /dev/null && exit 0; sleep 1; done
          docker logs appium >&2
          exit 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run conformance -- --url http://127.0.0.1:4723 --os linux

  macos:
    needs: static
    runs-on: macos-latest
    timeout-minutes: ${{ inputs.xa11y_ref && 40 || 20 }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Find the node binary
        id: node
        run: echo "path=$(node -p 'require("fs").realpathSync(process.execPath)')" >> "$GITHUB_OUTPUT"
      - uses: xa11y/setup-a11y@0dad2b7bb4c0d4601e99e53d9b42b3195274aa3d
        with:
          macos-tcc-client: ${{ steps.node.outputs.path }}
      # setup-a11y grants only Accessibility. Screenshots also need Screen Recording.
      - name: Grant Screen Recording to node
        env:
          CLIENT: ${{ steps.node.outputs.path }}
        run: |
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access(service,client,client_type,auth_value,auth_reason,auth_version,csreq,policy_id,indirect_object_identifier_type,indirect_object_identifier,indirect_object_code_identity,flags,last_modified) \
             VALUES('kTCCServiceScreenCapture','${CLIENT}',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$(date +%s));"
          sudo launchctl stop com.apple.tccd || true
          sleep 2
      # Inline predictions put a predicted word into the value of a TextEdit text area.
      - run: defaults write -g NSAutomaticInlinePredictionEnabled -bool false
      - run: hosts/mac/setup.sh --driver . --no-service
      - name: Use xa11y from xa11y_ref
        if: inputs.xa11y_ref
        env:
          XA11Y_REF: ${{ inputs.xa11y_ref }}
        run: scripts/xa11y-from-ref.sh "$XA11Y_REF"
      - name: Start Appium
        run: |
          "$HOME/Library/Application Support/appium-xa11y/host.sh" run > appium.log 2>&1 &
          for _ in $(seq 60); do curl -sf http://127.0.0.1:4723/status > /dev/null && exit 0; sleep 1; done
          echo "Appium did not start" >&2
          exit 1
      - run: npm run conformance -- --url http://127.0.0.1:4723 --os mac
      - name: The status of an Appium under a different Node.js shows its missing permissions
        run: |
          home="$HOME/Library/Application Support/appium-xa11y"
          other="$RUNNER_TEMP/other-node/node"
          mkdir -p "$(dirname "$other")"
          cp "$(node -p 'require("fs").realpathSync(process.execPath)')" "$other"
          APPIUM_HOME="$home/appium-home" "$other" "$home/appium/node_modules/.bin/appium" --port 4799 > other-appium.log 2>&1 &
          for _ in $(seq 60); do curl -sf http://127.0.0.1:4799/status > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:4799/xa11y/status | tee status.json
          kill %1
          OTHER="$other" node -e '
            const { value: v } = JSON.parse(require("fs").readFileSync("status.json", "utf8"));
            const want = `Grant Accessibility and Screen & System Audio Recording to ${process.env.OTHER} in System Settings > Privacy & Security, then start Appium again`;
            require("assert").deepEqual([v.accessibility, v.screenRecording, v.grantTo, v.next], [false, false, process.env.OTHER, want]);'
      - name: setup.sh stops when a different Appium holds its port
        run: |
          rc=0
          out=$(hosts/mac/setup.sh --driver . 2>&1) || rc=$?
          echo "$out"
          [ "$rc" != 0 ] && grep 'port 4723 is in use by pid [0-9]* (.*appium' <<<"$out" > /dev/null
      - name: setup.sh names what the LaunchAgent still needs
        run: |
          out=$(hosts/mac/setup.sh --driver . --port 4724 2>&1)
          echo "$out"
          grep -F "Grant Accessibility and Screen & System Audio Recording to $HOME/Library/Application Support/appium-xa11y/node/bin/node in System Settings > Privacy & Security, then restart Appium: launchctl kickstart -k gui/$(id -u)/appium-xa11y" <<<"$out" > /dev/null
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appium-log-macos
          path: appium.log
          if-no-files-found: ignore

  windows:
    needs: static
    runs-on: windows-latest
    timeout-minutes: ${{ inputs.xa11y_ref && 40 || 20 }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Prepare the Host
        shell: powershell
        run: hosts/windows/setup.ps1 -Driver . -NoService
      - name: Use xa11y from xa11y_ref
        if: inputs.xa11y_ref
        shell: bash
        env:
          XA11Y_REF: ${{ inputs.xa11y_ref }}
        run: scripts/xa11y-from-ref.sh "$XA11Y_REF"
      - name: Start Appium
        shell: bash
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "$LOCALAPPDATA/appium-xa11y/host.ps1" > appium.log 2>&1 &
          for _ in $(seq 60); do curl -sf http://127.0.0.1:4723/status > /dev/null && exit 0; sleep 1; done
          echo "Appium did not start" >&2
          exit 1
      - run: npm run conformance -- --url http://127.0.0.1:4723 --os windows
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appium-log-windows
          path: appium.log
          if-no-files-found: ignore
