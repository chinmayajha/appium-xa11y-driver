# Untested: written and checked with actionlint, but not run on GitHub yet.
# Copy to .github/workflows/ in a repository that has an optics-framework suite.
name: Desktop tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Folder of the optics suite
        default: tests/desktop

permissions:
  contents: read

jobs:
  optics:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Find the node binary
        id: node
        run: echo "path=$(node -p 'require("fs").realpathSync(process.execPath)')" >> "$GITHUB_OUTPUT"
      - uses: xa11y/setup-a11y@0dad2b7bb4c0d4601e99e53d9b42b3195274aa3d
        with:
          macos-tcc-client: ${{ steps.node.outputs.path }}
      - name: Grant Screen Recording to node
        env:
          CLIENT: ${{ steps.node.outputs.path }}
        run: |
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access(service,client,client_type,auth_value,auth_reason,auth_version,csreq,policy_id,indirect_object_identifier_type,indirect_object_identifier,indirect_object_code_identity,flags,last_modified) \
             VALUES('kTCCServiceScreenCapture','${CLIENT}',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$(date +%s));"
          sudo launchctl stop com.apple.tccd || true
          sleep 2
      - name: Install Appium, the driver and optics
        run: |
          npm install -g appium@3
          appium driver install --source=npm appium-xa11y-driver
          pip install optics-framework
      - name: Start Appium
        run: |
          appium --port 4723 --log appium.log &
          for _ in $(seq 60); do
            curl -sf http://127.0.0.1:4723/status > /dev/null && exit 0
            sleep 1
          done
          echo "Appium did not start" >&2
          exit 1
      - name: Run the suite
        env:
          SUITE: ${{ inputs.suite }}
        run: optics execute "$SUITE"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: optics-results
          path: |
            ${{ inputs.suite }}/execution_output
            appium.log
          if-no-files-found: ignore
